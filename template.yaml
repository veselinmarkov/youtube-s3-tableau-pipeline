AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: YouTube -> S3 pipeline for Tableau

Parameters:
  ScheduleExpression:
    Type: String
    Default: rate(1 hour)   # change to rate(1 day) later
  SecretName:
    Type: String
    Default: youtube-pipeline/oauth
  AnalyticsDays:
    Type: Number
    Default: 30

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.handler
      Runtime: python3.12
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          BUCKET: !Ref DataBucket
          SECRET_ID: !Ref SecretName
          ANALYTICS_DAYS: !Ref AnalyticsDays
      Policies:
        - S3WritePolicy: { BucketName: !Ref DataBucket }
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}-*
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression

  ReaderUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: read-youtube-data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${DataBucket.Arn}/*

Outputs:
  BucketName:
    Value: !Ref DataBucket
  ReaderUserName:
    Value: !Ref ReaderUser
